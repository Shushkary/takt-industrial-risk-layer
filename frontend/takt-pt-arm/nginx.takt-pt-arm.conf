# Static operator workstation concept at /takt_pt_arm/.
location = /takt_pt_arm {
    return 301 /takt_pt_arm/;
}

# Обычный REST буферизуется. Это важно: общий proxy ТАКТ отключает buffering
# для SSE и при нескольких запросах demo-worker может удерживать второй ответ.
location ^~ /takt_pt_arm/api/ {
    proxy_pass http://127.0.0.1:18092/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering on;
    proxy_read_timeout 30s;
}

# Для живого канала кейсов buffering, наоборот, обязательно выключен.
location = /takt_pt_arm/api/v1/stream/cases {
    proxy_pass http://127.0.0.1:18092/api/v1/stream/cases;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 86400s;
}

location = /takt_pt_arm/health {
    proxy_pass http://127.0.0.1:18092/health;
    proxy_set_header Host $host;
}

location ^~ /takt_pt_arm/ {
    root /var/www/ralta;
    try_files $uri $uri/ /takt_pt_arm/index.html;

    # Небольшие статические файлы отдаём с Content-Length. На текущем внешнем
    # контуре gzip + chunked периодически удерживал app.js в состоянии loading.
    gzip off;
    gzip_static on;

    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
}
