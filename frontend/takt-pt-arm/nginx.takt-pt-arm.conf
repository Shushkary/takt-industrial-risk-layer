# Static operator workstation concept at /takt_pt_arm/.
location = /takt_pt_arm {
    return 301 /takt_pt_arm/;
}

# Обычный REST буферизуется. Это важно: общий proxy ТАКТ отключает buffering
# для SSE и при нескольких запросах demo-worker может удерживать второй ответ.
#
# Префикс /api снимается: маршруты продукта зарегистрированы от корня (GET /cases,
# GET /session), отдельного контура /api в нём нет. Проверено запуском backend с
# --root-path=/api: uvicorn префикс не снимает, и /api/cases отвечает 404, тогда как
# /cases отвечает 200. Прежнее `proxy_pass .../api/;` досылало префикс на backend, то
# есть каждый запрос АРМ через nginx давал 404. Локальный стенд (scripts/serve_pt_arm.py)
# снимает префикс так же — конфигурации не должны расходиться.
location ^~ /takt_pt_arm/api/ {
    proxy_pass http://127.0.0.1:18092/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering on;
    proxy_read_timeout 30s;
}

# Здесь был маршрут живого канала кейсов /api/v1/stream/cases. Контура /api/v1 в продукте
# нет — это остаток прежней редакции интерфейса, которая обращалась к несуществующему
# API. Маршрут удалён: он перехватывал путь раньше общего блока выше и молча уводил
# запрос в никуда.

location = /takt_pt_arm/health {
    proxy_pass http://127.0.0.1:18092/health;
    proxy_set_header Host $host;
}

# Пояснения в АРМ ссылаются на документы репозитория (поле `doc` в реестре пояснений).
# Раздача выключена намеренно: это внутренняя проектная документация, и её публикация
# наружу — решение владельца, а не следствие правки интерфейса. Включить можно двумя
# способами: выложить `docs/` рядом со статикой и снять комментарий с блока ниже, либо
# задать `window.TAKT_DOCS_BASE` до загрузки сборки — тогда ссылки уйдут во внутреннюю вики.
#
# location ^~ /takt_pt_arm/docs/ {
#     root /var/www/ralta;
#     try_files $uri =404;
#     add_header Cache-Control "no-store" always;
# }

location ^~ /takt_pt_arm/ {
    root /var/www/ralta;
    try_files $uri $uri/ /takt_pt_arm/index.html;

    # Небольшие статические файлы отдаём с Content-Length. На текущем внешнем
    # контуре gzip + chunked периодически удерживал app.js в состоянии loading.
    gzip off;
    gzip_static on;

    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
}
