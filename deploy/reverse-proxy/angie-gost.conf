# Angie (nginx-совместимый) с ГОСТ-TLS для терминации mTLS и проксирования в TAKT API.
# Замените пути к сертификатам и upstream на значения вашего контура.
# Клиентский сертификат: поле DN пробрасывается в заголовок, заданный TAKT_MTLS_DN_HEADER (например X-TAKT-Client-DN).

upstream takt_api {
    server 127.0.0.1:8000;
}

server {
    listen 443 ssl;
    server_name takt.example.local;

    # ssl_certificate     /etc/nginxt/ssl/server_gost.pem;
    # ssl_certificate_key /etc/nginxt/ssl/server_gost.key;
    # Директивы ГОСТ-TLS зависят от сборки Angie/nginx с криптопровайдером (см. документацию дистрибутива).

    ssl_verify_client optional_no_ca;
    ssl_client_certificate /etc/nginxt/ssl/ca_client.pem;

    # DN из клиентского сертификата — доверенный заголовок только от этого прокси (задайте TAKT_TRUSTED_PROXY_CIDRS).
    proxy_set_header X-TAKT-Client-DN $ssl_client_s_dn;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://takt_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
