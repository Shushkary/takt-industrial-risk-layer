# Пример связки stunnel в режиме TLS-терминации (ГОСТ) с локальным HTTP-upstream TAKT.
# В production предпочтительнее полноценный reverse-proxy (см. angie-gost.conf).
# После расшифровки трафик идёт на 127.0.0.1:8000; заголовок с DN должен добавлять основной прокси.

# Псевдоконфигурация: синтаксис stunnel зависит от сборки с GOST engine.
# [takt-https]
# accept = 443
# connect = 127.0.0.1:8000
# cert = /etc/stunnel/server.pem
# key = /etc/stunnel/server.key
# В промышленном контуре согласуйте параметры с документацией Астра Линукс / РЕД ОС для ГОСТ-TLS.
