# Витрина АРМ аналитика SOC на ralta.ru/PT.
#
# Подключение: скопировать в /etc/nginx/snippets/takt-pt.conf на ВМ и добавить
# в server-блок ralta.ru строку `include /etc/nginx/snippets/takt-pt.conf;`.
# Корень статики: /var/www/ralta/PT (см. deploy/pt-demo/deploy.sh).

location = /PT {
    return 301 /PT/;
}

location /PT/ {
    alias /var/www/ralta/PT/;

    # SPA: любой маршрут отдаёт index.html, ассеты — как есть.
    try_files $uri $uri/ /PT/index.html;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Ассеты собираются с хешем в имени — их можно кэшировать надолго,
    # index.html кэшировать нельзя, иначе выкладка не подхватится.
    location ~* ^/PT/assets/.*\.(js|css|woff2?|svg|png)$ {
        alias /var/www/ralta/PT/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /PT/index.html {
        alias /var/www/ralta/PT/index.html;
        add_header Cache-Control "no-store";
    }
}
