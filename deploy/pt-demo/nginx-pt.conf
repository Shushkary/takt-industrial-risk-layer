# Витрина АРМ аналитика SOC на ralta.ru/PT — статика, отдельно от всего остального.
#
# Сниппет включается ВНУТРЬ server-блока ralta.ru:
#   include /etc/nginx/snippets/takt-pt-static.conf;
#
# Он добавляет только свои location и ничего не меняет в уже настроенных путях.
# В частности, существующий `/takt_pt/` (проксирование на Docker) не затрагивается:
# `/PT/` и `/takt_pt/` — непересекающиеся префиксы URI, nginx выбирает location по
# самому длинному совпадающему префиксу, и запрос `/PT/...` в `/takt_pt/` не попадает.
#
# ВАЖНО: все директивы намеренно находятся внутри location. Любой `add_header` или
# `root`, вынесенный на верхний уровень сниппета, применился бы ко всему server-блоку,
# то есть и к соседним путям — этого делать нельзя.
#
# Корень статики: /var/www/ralta/PT (см. deploy/pt-demo/deploy.sh).

# Без завершающего слэша браузер иначе соберёт относительные пути от корня домена.
location = /PT {
    return 301 /PT/;
}

# `^~` означает: если этот префикс совпал, регулярные location не проверяются.
# Без него общий regex вроде `location ~* \.(js|css)$` в конфиге сайта перехватил бы
# ассеты витрины и отдал бы их мимо этого блока.
location ^~ /PT/ {
    # Каталог называется PT и совпадает с префиксом URI, поэтому alias не нужен:
    # /PT/assets/x.js → /var/www/ralta/PT/assets/x.js. root надёжнее alias в паре
    # с try_files, где alias даёт известные краевые эффекты.
    root /var/www/ralta;

    # SPA: неизвестный маршрут отдаёт index.html, существующий файл — как есть.
    try_files $uri $uri/ /PT/index.html;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

# Имена ассетов содержат хеш содержимого, поэтому их можно кэшировать надолго.
# add_header не наследуется, если у дочернего блока есть свои — заголовки повторены.
location ^~ /PT/assets/ {
    root /var/www/ralta;
    try_files $uri =404;

    expires 30d;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}

# index.html кэшировать нельзя: иначе браузер не увидит новую выкладку.
location = /PT/index.html {
    root /var/www/ralta;

    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
}
