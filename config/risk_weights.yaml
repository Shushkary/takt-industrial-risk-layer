# Метка версии конфигурации. Указывается в отчёте разметки (GET /analytics/invariant-feedback),
# чтобы предложение изменить правило было привязано к тому, против чего оно посчитано.
# Поднимается вручную при изменении весов или порогов.
version: "2026.08.1"

# Веса факторов Risk = F(R, G, C, U, DQ) — ТЗ MPV 2.0
rhythm: 0.22
graph: 0.22
context: 0.18
user: 0.18
data_quality: 0.20

# Пороги
mandelbrot_entropy_cap: 2.5
dq_degraded_threshold: 0.5
feigenbaum_target: 4.669201609

# Слияние кейсов (L2): bucketed — ключ актив|операция|time_bucket(UTC); legacy — source|актив|операция
alert_fatigue:
  mode: bucketed
  bucket_sec: 300

# SOC-корреляция. Пока mode=legacy сохраняет byte-to-byte поведение OT-конвейера;
# правила используются новым обобщённым коррелятором в порядке priority.
correlation:
  mode: legacy
  keys:
    - name: host_window
      fields: [host_id]
      bucket_sec: 600
      priority: 10
    - name: user_destination
      fields: [user_id, dst_address]
      bucket_sec: 300
      priority: 20
    - name: file_hash
      fields: ["artifact:hash"]
      priority: 30

# Асимптотическая отсечка при высоком EPS (нормировка весов)
eps_soft_cap: 100000

# Пороги классов риска (ранее были захардкожены в risk_engine.py).
#
# Достижимый максимум балла — 0.800, а не 1.0: вектор качества данных и множитель качества
# связаны обратно (вектор = 1 − dq_score, а итог умножается на dq_score), поэтому вес 0.20
# нельзя «получить» — подняв вектор, теряешь на множителе больше, чем приобретаешь. Порог
# critical 0.85 при этих порогах недостижим. Промышленная шкала оставлена как есть: она под
# сертификационным треком и меняется отдельным решением владельца.
risk_class_thresholds:
  critical: 0.85
  high: 0.65
  medium: 0.4

# Контур, под который выбирается шкала классов: industrial | soc.
# Переопределяется переменной окружения TAKT_RISK_SCALE — стенд SOC не правит этот файл.
risk_scale: industrial

# Шкала SOC-контура: те же доли шкалы, что и в промышленном треке, пересчитанные на
# достижимый максимум 0.800 (0.85 → 0.68, 0.65 → 0.52, 0.40 → 0.32). Новых пропорций не
# вводится: 0.68 — это те же 85% шкалы, 0.52 — те же 65%.
risk_class_thresholds_soc:
  critical: 0.68
  high: 0.52
  medium: 0.32

# Топология для JumpServerBypass (граф задаётся снаружи; здесь — эталонные хосты)
topology:
  jump_host: jump-01
  plc_hosts:
    - plc-01
    - plc-02
  # Рёбра для демо POST /assess (обход jump). Если пусто — одно ребро eng-workstation -> первый plc_hosts
  demo_graph_edges:
    - src: eng-workstation
      dst: plc-01
      kind: ssh

# Инварианты (движок extended rules). allowed_function_codes: null — проверка отключена.
invariants:
  allowed_function_codes: null
  expected_payload_baseline: null
  payload_drift_ratio: 0.45
  auth_fail_window: 20
  auth_fail_threshold: 5
  # ASDU type ids (IEC 60870-5-104), запрещённые для сегмента; при совпадении в payload iec104_type_id — инвариант illegal_function_code
  iec104_disallowed_type_ids: []

# Нормализация семантики payload до оценки риска (флаги для инвариантов)
enrichment:
  enabled: true
  air_gap_segments:
    - AIR_GAP_L2
  # Подстановка iec104_type_id из сырых колонок CSV/импорта (asdu_type, type_id, …)
  iec104_type_aliases:
    - asdu_type
    - asdu_type_id
    - type_id
    - iec_asdu_type

# Доверие источников для DQ / Inv_DQ_03 (0..1). Ключи = значения EventSource (plc_polling, auth_logs, …)
ingest_trust:
  by_source:
    plc_polling: 1.0
    auth_logs: 0.92
    network_events: 0.78
    service_desk: 0.95
    unknown: 0.5

# SQLite-файл кейсов (если storage.backend: sqlite); каталог создаётся при старте API
storage:
  backend: memory
  sqlite_path: data/takt_cases.db

# Webhook SIEM: пустой список = разрешены только loopback-хосты (127.0.0.1, localhost, ::1)
siem_webhook:
  allowed_url_prefixes: []
  retries: 3
  backoff_sec: 0.35

# Экспорт: путь к TTF с кириллицей внутри репозитория (напр. assets/fonts/DejaVuSans.ttf); пусто — только Helvetica + latin-1 fallback
export:
  # Шрифт с кириллицей для PDF: путь относительно корня проекта. Без него текст сводится
  # к latin-1 и русские буквы превращаются в «?». В образе файл кладёт Dockerfile из
  # системного пакета fonts-dejavu-core. При запуске из исходников файла может не быть —
  # тогда экспорт молча откатывается на Helvetica, это ожидаемое поведение.
  pdf_unicode_font: "assets/fonts/DejaVuSans.ttf"
