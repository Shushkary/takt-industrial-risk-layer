# Метка версии конфигурации. Указывается в отчёте разметки (GET /analytics/invariant-feedback),
# чтобы предложение изменить правило было привязано к тому, против чего оно посчитано.
# Поднимается вручную при изменении весов или порогов.
version: "2026.09.1"

# Веса факторов Risk = F(R, G, C, U, DQ) — ТЗ MPV 2.0
rhythm: 0.22
graph: 0.22
context: 0.18
user: 0.18
data_quality: 0.20

# Пороги
mandelbrot_entropy_cap: 2.5
dq_degraded_threshold: 0.5
feigenbaum_target: 4.669201609

# Слияние кейсов (L2): bucketed — ключ актив|операция|time_bucket(UTC); legacy — source|актив|операция
alert_fatigue:
  mode: bucketed
  bucket_sec: 300

# SOC-корреляция. Ключ слияния `alert_fatigue` (актив + операция + бакет) связывает только
# повторы одной операции на одном активе. Цепочка атаки по определению состоит из разных
# операций на разных узлах, поэтому при `mode: legacy` она разбиралась на десятки отдельных
# дел: 27 связанных событий давали 24 дела, а собрать инцидент мог только аналитик вручную
# через `POST /cases/assemble/pivot`. Режим `generalized` включает правила ниже.
#
# `sources` — область применения правила, и она задана явно. Правило «узел в окне» осмысленно
# для потока SOC и меняет разбор промышленного контура, где ключом слияния остаются актив и
# операция: `plc_polling` (опрос ПЛК), `auth_logs` и `service_desk` под корреляцию не
# попадают. Новый класс источника попадает в правило только решением в этом файле —
# неизвестное имя источника отбрасывает правило целиком, а не расширяет его молча.
# Сторож: tests/test_correlation_config_contract.py.
correlation:
  mode: generalized
  keys:
    - name: host_window
      fields: [host_id]
      bucket_sec: 600
      priority: 10
      sources: [edr, siem, ndr, ot, network_events]
    - name: user_destination
      fields: [user_id, dst_address]
      bucket_sec: 300
      priority: 20
      sources: [edr, siem, ndr, ot, network_events]
    - name: file_hash
      fields: ["artifact:hash"]
      priority: 30
      sources: [edr, siem, ndr, ot, network_events]

# Асимптотическая отсечка при высоком EPS (нормировка весов)
eps_soft_cap: 100000

# Пороги классов риска (ранее были захардкожены в risk_engine.py).
#
# Откачены 2026-08-24 к 0.85 / 0.65 / 0.40 после того, как из combine_risk снят множитель
# качества данных. Промежуточный набор 0.68 / 0.52 / 0.32 назначался долями от достижимого
# максимума 0.800: пока балл умножался на dq_score, вес вектора качества (0.20) нельзя было
# «получить» — подняв вектор, теряешь на множителе больше, чем приобретаешь. Теперь качество
# входит в оценку одним каналом (взвешенным вектором), потолок шкалы снова равен 1.000, и
# доли шкалы — 85% / 65% / 40% — совпадают с исходной калибровкой.
#
# Шкала одна для обоих контуров: после того как срабатывания SOC начали поднимать векторы
# ритма и контекста, достижимый максимум у промышленного и SOC-контура одинаковый.
# Разбор и замеры — docs/risk_scale_calibration.md.
risk_class_thresholds:
  critical: 0.85
  high: 0.65
  medium: 0.40

# Топология для JumpServerBypass (граф задаётся снаружи; здесь — эталонные хосты)
topology:
  jump_host: jump-01
  plc_hosts:
    - plc-01
    - plc-02
  # Рёбра для демо POST /assess (обход jump). Если пусто — одно ребро eng-workstation -> первый plc_hosts
  demo_graph_edges:
    - src: eng-workstation
      dst: plc-01
      kind: ssh

# Инварианты (движок extended rules). allowed_function_codes: null — проверка отключена.
invariants:
  allowed_function_codes: null
  expected_payload_baseline: null
  payload_drift_ratio: 0.45
  auth_fail_window: 20
  auth_fail_threshold: 5
  # ASDU type ids (IEC 60870-5-104), запрещённые для сегмента; при совпадении в payload iec104_type_id — инвариант illegal_function_code
  iec104_disallowed_type_ids: []

# Нормализация семантики payload до оценки риска (флаги для инвариантов)
enrichment:
  enabled: true
  air_gap_segments:
    - AIR_GAP_L2
  # Подстановка iec104_type_id из сырых колонок CSV/импорта (asdu_type, type_id, …)
  iec104_type_aliases:
    - asdu_type
    - asdu_type_id
    - type_id
    - iec_asdu_type

# Доверие источников для DQ / Inv_DQ_03 (0..1). Ключи = значения EventSource (plc_polling, auth_logs, …)
ingest_trust:
  by_source:
    plc_polling: 1.0
    auth_logs: 0.92
    network_events: 0.78
    service_desk: 0.95
    unknown: 0.5

# SQLite-файл кейсов (если storage.backend: sqlite); каталог создаётся при старте API
storage:
  backend: memory
  sqlite_path: data/takt_cases.db

# Сборка связанного инцидента по мере приёма потока. Работает только при storage.backend: sqlite —
# без постоянного хранилища событий искать по сущностям не в чем.
incident_assembly:
  # worker    — приём только отмечает работу, собирает `python -m takt.tools.assembly_worker`
  #             (значение по умолчанию: приём не платит за прогон; воркер обязателен, иначе
  #             сигналы копятся и инциденты не появляются — API пишет об этом в лог при старте);
  # on_ingest — прогон идёт в процессе приёма: инцидент появляется сразу, приём ждёт прогона
  #             (на 8000 дел это 1,8 с на каждое срабатывание). Отдельный процесс не нужен;
  # off       — сборка только по кнопке «Собрать инциденты» / POST /cases/assemble/auto
  mode: worker
  # Сущность считается отличительной, если встречается в принятом потоке не чаще этого числа раз.
  # Не универсальная константа: короткая атака и многочасовая требуют разных значений —
  # разбор в docs/pt_techlab/correlation_quality.md
  distinctive_max_events: 12
  # Сколько срабатываний инвариантов накопить перед прогоном сборки (только при mode: on_ingest).
  # 1 — инцидент появляется сразу за аномалией; выше — когда обход хранилища дел дорог
  hits_between_runs: 1
  # Как часто воркер (mode: worker) проверяет очередь сигналов, секунды. Задаёт задержку между
  # срабатыванием и появлением инцидента; пустой цикл стоит одного короткого запроса
  worker_poll_sec: 2.0

# Webhook SIEM: пустой список = разрешены только loopback-хосты (127.0.0.1, localhost, ::1)
siem_webhook:
  allowed_url_prefixes: []
  retries: 3
  backoff_sec: 0.35

# Экспорт: путь к TTF с кириллицей внутри репозитория (напр. assets/fonts/DejaVuSans.ttf); пусто — только Helvetica + latin-1 fallback
export:
  # Шрифт с кириллицей для PDF: путь относительно корня проекта. Без него текст сводится
  # к latin-1 и русские буквы превращаются в «?». В образе файл кладёт Dockerfile из
  # системного пакета fonts-dejavu-core. При запуске из исходников файла может не быть —
  # тогда экспорт молча откатывается на Helvetica, это ожидаемое поведение.
  pdf_unicode_font: "assets/fonts/DejaVuSans.ttf"
