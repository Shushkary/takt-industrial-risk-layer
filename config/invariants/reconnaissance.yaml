# T1595.002 «Active Scanning» и T1046 «Network Service Discovery»), а не по нашей догадке.
# Взяты только те, чьё имя означает прощупывание независимо от датасета.
#
# Намеренно НЕ добавлен WEB_SERVER_400_ERROR_CODE: одиночная 400 — рутина веб-сервера,
# и 32 таких события из EXT-001 дали бы поток ложных срабатываний. Признаком разведки
# служит их серия с одного адреса — она объявлена отдельным вердиктом ниже.
