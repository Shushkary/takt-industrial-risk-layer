# Перевод объявленных классификаций средств обнаружения в фазы цепочки ТАКТ.
#
# ТАКТ фазу не вычисляет и не угадывает (см. `takt/domain/entities/kill_chain.py`): она
# приходит от разметки датасета или от вышестоящего средства обнаружения. Категория инцидента
# PT SIEM — как раз такая объявленная классификация, а не наше толкование события, поэтому её
# перевод в фазу допустим. Основание перевода — смысл имени категории вне конкретного стенда;
# происхождение фазы сохраняется в событии (`attack_phase_origin`) и видно аналитику.
#
# Значения `pt_siem_categories` взяты из таксономии стенда (`taxonomy.json`, поле
# `incident.category`, 34 значения, сборка 27.0.859).
#
# Правило отбора то же, что для вердиктов AIT-ADS в `config/invariants/*.yaml`: сопоставляется
# только то, чьё имя означает ту же фазу вне этого стенда. Всё неоднозначное перечислено ниже
# в `not_mapped` — с причиной. Пустая фаза честнее приписанной: событие просто не войдёт в
# цепочку, и это видно в счётчике «без разметки фазы».

version: 1

mappings:
  - phase: recon
    reason: >-
      Сканирование сети — сбор сведений о доступных узлах и службах. Означает разведку
      независимо от стенда.
    pt_siem_categories: [NetworkScan]

  - phase: initial_access
    reason: >-
      Подбор пароля, фишинг и пробитие периметра — способы получить первичный доступ.
      Категории названы по вектору проникновения, а не по последствию.
    pt_siem_categories: [BruteForce, Phishing, SecurityPerimeterBreach]

  - phase: c2
    reason: >-
      Управляющий сервер ботнета и узел ботнета — обе стороны управляющего канала.
      Ботнет по определению управляется извне, другой фазы у этих категорий нет.
    pt_siem_categories: [BotNetCC, BotNetNode]

  - phase: persistence
    reason: >-
      Обнаруженный бэкдор — средство сохранить доступ после перезагрузки и смены пароля,
      то есть закрепление.
    pt_siem_categories: [SecurityBackdoorDetection]

  - phase: exfiltration
    reason: >-
      Утечка данных — вынос информации за периметр. Это и есть эксфильтрация.
    pt_siem_categories: [DataLeakage]

  - phase: impact
    reason: >-
      Отказ в обслуживании, несанкционированное изменение и удаление данных — воздействие на
      доступность и целостность, то есть наблюдаемое последствие, а не подготовительный шаг.
    pt_siem_categories: [DOSAttack, DoSDDoS, UnauthorizedDataChange, UnauthorizedDataDeletion]

# Категории, которые намеренно НЕ переводятся в фазу. Этот перечень важнее списка выше:
# соблазн приписать фазу каждой категории даёт полную цепочку на витрине и ложные шаги в
# доказательном пакете — ровно то, от чего продукт обещает избавить.
not_mapped:
  - category: HackToolsDetection
    reason: >-
      Найден хакерский инструмент. Факт наличия не говорит, запускали ли его и на каком шаге:
      это может быть и подготовка, и выполнение, и след прошлой активности.
  - category: HostOrSoftCompromising
    reason: >-
      Компрометация узла или ПО — состояние, а не шаг. Фаза, на которой она произошла,
      из категории не следует.
  - category: MaliciousResources
    reason: >-
      Обращение к вредоносному ресурсу бывает и доставкой, и управляющим каналом.
      Выбор одной фазы был бы догадкой.
  - category: ProtectionBypassing
    reason: >-
      Обход средств защиты в модели ТАКТ отдельной фазы не имеет; приписывать его эскалации
      или закреплению значит подменять смысл.
  - category: PermissionViolation
    reason: >-
      Нарушение прав доступа не равно эскалации привилегий: чаще это ошибка настройки или
      действие штатного пользователя за пределами роли.
  - category: CriticalVulnerabilityDetection
    reason: >-
      Найденная уязвимость — свойство актива, а не действие нарушителя.
  - category: SoftwareSuspiciousActivity
    reason: >-
      «Подозрительная активность» не называет шаг атаки: это приглашение разобраться,
      а не классификация.
  - category: BackupMalfunction
    reason: Сбой резервного копирования — эксплуатационная неисправность, а не шаг атаки.
  - category: ProtectionMalfunction
    reason: Сбой средства защиты сам по себе не свидетельствует об атаке.
  - category: ServiceMalfunction
    reason: Сбой службы — эксплуатационное событие.
  - category: SoftwareMalfunction
    reason: Сбой ПО — эксплуатационное событие.
  - category: PatchPolicyViolation
    reason: Нарушение политики обновлений — состояние управления уязвимостями.
  - category: SoftwareInstallationPolicyViolation
    reason: Нарушение политики установки ПО — организационное несоответствие.
  - category: ForbiddenServiceUsage
    reason: Использование запрещённой службы — нарушение регламента, не обязательно атака.
  - category: Spam
    reason: Спам — поток нежелательных сообщений, шагом цепочки не является.
  - category: VirusDetection
    reason: >-
      Обнаружение вредоносного файла не говорит, запускался ли он: находка антивируса бывает
      и в карантине, и в почтовом вложении, которое никто не открыл.
  - category: TrojanHorseDetection
    reason: >-
      То же основание, что и у обнаружения вируса: найден образец, а не зафиксирован запуск.
  - category: WormDetection
    reason: >-
      Обнаружение червя не отличает найденный образец от состоявшегося самораспространения,
      а это разные фазы.
  - category: VulnerabilityExploitation
    reason: >-
      Эксплуатация уязвимости в ATT&CK встречается в трёх разных тактиках — первичный доступ,
      выполнение и эскалация привилегий. Из имени категории фаза не следует.
  - category: UnauthorizedAccess
    reason: >-
      Несанкционированный доступ бывает и входом извне, и перемещением между узлами уже
      внутри периметра.
  - category: UserCompromising
    reason: >-
      Компрометация учётной записи — состояние учётки; фаза, на которой она произошла,
      из категории не следует.
  - category: Undefined
    reason: Категория не задана источником — переводить нечего.
