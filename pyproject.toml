[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "takt-industrial-risk-layer"
version = "0.6.23"
description = "ТАКТ MVP — второй аналитический эшелон для КИИ/АСУ ТП (Industrial Risk Layer)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.10.0",
  "pyyaml>=6.0.2",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
  "hypothesis>=6.100.0",
  "import-linter>=2.0",
  "fpdf2>=2.8.0",
  "prometheus-client>=0.21.0",
  "pygments>=2.20.0",
  "lxml>=6.1.0",
  "pip-audit>=2.7.0",
  "cyclonedx-bom>=4.1.0",
  "schemathesis>=3.30.0",
  "mutmut>=2.4.5",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
]
metrics = [
  "prometheus-client>=0.21.0",
]
export = [
  "fpdf2>=2.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.importlinter]
root_package = "takt"
include_external_packages = true

# Направление зависимостей всего стека. Два контракта ниже запрещают конкретные
# импорты; этот задаёт порядок слоёв целиком и закрывает то, чего они не видели:
# `takt.tools` (точки входа CLI) не был назван ни в одном контракте, и ничто не мешало
# домену или сценарию импортировать командную строку, а инфраструктуре — слой доставки
# (это замкнуло бы цикл L3 ↔ L4).
[[tool.importlinter.contracts]]
name = "Layers L1-L4 + entrypoints"
type = "layers"
layers = [
  "takt.tools",
  "takt.interface_adapters",
  "takt.infrastructure",
  "takt.application",
  "takt.domain",
]

[[tool.importlinter.contracts]]
name = "Domain is independent (L1)"
type = "forbidden"
source_modules = ["takt.domain"]
forbidden_modules = [
  "takt.application",
  "takt.interface_adapters",
  "takt.infrastructure",
  "fastapi",
  "uvicorn",
  "sqlalchemy",
  "pydantic_settings",
]

[[tool.importlinter.contracts]]
name = "Application does not depend on delivery or infra"
type = "forbidden"
source_modules = ["takt.application"]
forbidden_modules = [
  "takt.infrastructure",
  "takt.interface_adapters",
  "fastapi",
  "uvicorn",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# E501 — длину строк держит форматирование, а не линтер (line-length выше — ориентир).
# B008 — вызов в значении аргумента по умолчанию: так устроены зависимости FastAPI (Depends, Query).
# RUF001/002/003 — «неоднозначные» символы Юникода. По регламенту (CLAUDE.md) комментарии,
#   docstring и сообщения в этом проекте на русском, и правило считает подозрительной каждую
#   кириллическую букву, похожую на латинскую («с», «е», «о», «р»). Это 1947 срабатываний из
#   2372 — весь сигнал линтера тонул в них. Подмену латиницы на кириллицу в идентификаторах
#   правило всё равно не поймало бы: имена в коде латинские, а строки — человеческий текст.
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["takt"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "SIM117"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["takt"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true
