# АРМ аналитика демонстрационного стенда: статика по `/`, API по `/api/`.
#
# Префикс `/api` снимается перед передачей на backend: маршруты продукта
# зарегистрированы от корня (`GET /cases`, `GET /session`), отдельного контура
# `/api` в нём нет. Косая черта в конце `proxy_pass` — именно это и делает;
# без неё каждый запрос АРМ приходил бы на `/api/cases` и получал 404.
server {
    listen 80;
    server_name _;
    charset utf-8;

    # Обычный REST буферизуется — так несколько параллельных запросов АРМ
    # не удерживают друг друга.
    location ^~ /api/ {
        proxy_pass http://api:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass http://api:8090/health;
        proxy_set_header Host $host;
    }

    # Пояснения в окнах АРМ ссылаются на документы проекта. В пакете лежит выборка
    # тех документов, на которые есть ссылки (см. README.md).
    #
    # Тип содержимого задан явно: расширения `.md` в `mime.types` нет, поэтому по
    # умолчанию документ уходит как `application/octet-stream` и вместе с
    # `nosniff` скачивается вместо показа — ссылка выглядит сломанной.
    location ^~ /docs/ {
        root /usr/share/nginx;
        try_files $uri =404;

        types { }
        default_type text/plain;
        charset utf-8;

        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        # Сборка АРМ кэшируется агрессивно; на стенде это скрывает обновления.
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }
}
